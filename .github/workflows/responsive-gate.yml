name: responsive-gate

# GREEN GATE for stock.ipe.rest responsive UI (RESPONSIVE_UI.md).
# Runs the Playwright responsive regression suite on every push/PR to main.
# A failure fails the job → this becomes a required status check that blocks
# merge/deploy (see tests/RESPONSIVE_QA.md "How this gates deploys").
# Aligns with ENGINEERING_STANDARDS §0 (green gate before ship).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: responsive-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  responsive:
    name: responsive regression (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run responsive gate
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
