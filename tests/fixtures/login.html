<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIXTURE — Login shell (style.css)</title>
<!-- Real production CSS. Fixture lives in tests/fixtures/, so climb two levels. -->
<link rel="stylesheet" href="../../style.css">
<style>:root{--font-geist-sans:system-ui,Arial,sans-serif;--font-geist-mono:ui-monospace,'Courier New',monospace}</style>
</head>
<!-- The passphrase gate (index.html #login). Two-column split ≤760 → single column,
     .login-visual hidden. The big display h1 (42px→35px) is the overflow risk at 320. -->
<body>
<main class="login-shell" id="login">
  <section class="login-card">
    <div class="login-brand"><span>R</span> recovery.console</div>
    <p class="eyebrow">AUTOMATED TRADING MONITOR</p>
    <h1>원금 회복 과정을<br>매일, 한눈에.</h1>
    <p class="login-copy">자동매매의 성과와 위험 신호를 조용하고 정확하게 확인하는 개인용 대시보드입니다.</p>
    <label class="input-label" for="uid">아이디</label>
    <input class="login-input" id="uid" autocomplete="username" aria-label="아이디" placeholder="davy.kim">
    <label class="input-label" for="pw">비밀번호</label>
    <input class="login-input" id="pw" type="password" autocomplete="current-password" aria-label="비밀번호">
    <button class="login-button" id="loginBtn">대시보드 열기 <span>&rarr;</span></button>
    <p class="login-note" id="loginErr"><i></i> 아이디와 비밀번호를 입력하세요.</p>
  </section>
  <aside class="login-visual" aria-hidden="true">
    <div class="visual-grid"></div>
    <div class="visual-copy"><b id="visualPct">63%</b><span>원금 회복 진행률</span></div>
    <div class="visual-line"></div>
  </aside>
</main>
</body>
</html>
